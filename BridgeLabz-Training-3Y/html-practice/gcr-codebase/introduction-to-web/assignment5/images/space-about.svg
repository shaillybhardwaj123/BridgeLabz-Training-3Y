<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
    <defs>
        <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="50%" stop-color="#64748b" />
            <stop offset="100%" stop-color="#334155" />
        </linearGradient>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
    </defs>
    <!-- Background Frame -->
    <rect width="500" height="400" fill="#0f172a" rx="16" />
    <!-- Grid pattern overlay -->
    <g stroke="#1e293b" stroke-width="1">
        <line x1="50" y1="0" x2="50" y2="400" />
        <line x1="100" y1="0" x2="100" y2="400" />
        <line x1="150" y1="0" x2="150" y2="400" />
        <line x1="200" y1="0" x2="200" y2="400" />
        <line x1="250" y1="0" x2="250" y2="400" />
        <line x1="300" y1="0" x2="300" y2="400" />
        <line x1="350" y1="0" x2="350" y2="400" />
        <line x1="400" y1="0" x2="400" y2="400" />
        <line x1="450" y1="0" x2="450" y2="400" />
        
        <line x1="0" y1="50" x2="500" y2="50" />
        <line x1="0" y1="100" x2="500" y2="100" />
        <line x1="0" y1="150" x2="500" y2="150" />
        <line x1="0" y1="200" x2="500" y2="200" />
        <line x1="0" y1="250" x2="500" y2="250" />
        <line x1="0" y1="300" x2="500" y2="300" />
        <line x1="0" y1="350" x2="500" y2="350" />
    </g>
    <!-- Futuristic Space Station Silhouette -->
    <!-- Large core ring -->
    <circle cx="250" cy="200" r="100" fill="none" stroke="url(#metal)" stroke-width="20" />
    <circle cx="250" cy="200" r="100" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.8" />
    
    <!-- Core Hub -->
    <circle cx="250" cy="200" r="40" fill="url(#metal)" />
    <!-- Connector spokes -->
    <line x1="250" y1="100" x2="250" y2="300" stroke="url(#metal)" stroke-width="12" />
    <line x1="150" y1="200" x2="350" y2="200" stroke="url(#metal)" stroke-width="12" />
    
    <!-- Solar Panels -->
    <rect x="50" y="180" width="60" height="40" fill="#1e3a8a" rx="2" stroke="#3b82f6" stroke-width="2" />
    <rect x="390" y="180" width="60" height="40" fill="#1e3a8a" rx="2" stroke="#3b82f6" stroke-width="2" />
    <!-- Connection beams -->
    <line x1="110" y1="200" x2="150" y2="200" stroke="#64748b" stroke-width="6" />
    <line x1="350" y1="200" x2="390" y2="200" stroke="#64748b" stroke-width="6" />
    
    <!-- Small flashing beacon lights -->
    <circle cx="250" cy="90" r="4" fill="#ef4444" />
    <circle cx="250" cy="310" r="4" fill="#10b981" />
</svg>
