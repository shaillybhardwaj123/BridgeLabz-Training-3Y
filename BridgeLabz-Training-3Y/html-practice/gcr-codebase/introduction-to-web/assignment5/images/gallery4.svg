<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="city-dusk" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="60%" stop-color="#311042" />
            <stop offset="100%" stop-color="#4c0519" />
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#city-dusk)" />
    <!-- Buildings -->
    <g fill="#11052c">
        <rect x="30" y="120" width="60" height="180" />
        <rect x="110" y="80" width="80" height="220" />
        <rect x="210" y="140" width="70" height="160" />
        <rect x="300" y="100" width="60" height="200" />
    </g>
    <!-- Windows (glowing yellow) -->
    <g fill="#fef08a" opacity="0.7">
        <circle cx="50" cy="150" r="2" />
        <circle cx="70" cy="150" r="2" />
        <circle cx="50" cy="180" r="2" />
        <circle cx="70" cy="180" r="2" />
        
        <rect x="130" y="100" width="10" height="15" />
        <rect x="150" y="100" width="10" height="15" />
        <rect x="130" y="140" width="10" height="15" />
        <rect x="150" y="140" width="10" height="15" />
        <rect x="130" y="180" width="10" height="15" />
        <rect x="150" y="180" width="10" height="15" />
        
        <circle cx="320" cy="130" r="3" />
        <circle cx="340" cy="130" r="3" />
        <circle cx="320" cy="160" r="3" />
        <circle cx="340" cy="160" r="3" />
    </g>
</svg>
