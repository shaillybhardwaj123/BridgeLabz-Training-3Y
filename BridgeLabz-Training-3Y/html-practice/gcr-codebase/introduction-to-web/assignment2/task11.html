<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Span Elements</title>
</head>
<body>
    <h1>Generic Inline Styling (Span)</h1>
    
    <p>
        The development sprint status is currently marked as: 
        <span id="label-status">Active</span>, 
        with the priority designated as <span id="label-priority">High</span>, 
        and the lead engineer assigned to <span id="label-assignee">Shailly Bhardwaj</span>.
    </p>
</body>
</html>
