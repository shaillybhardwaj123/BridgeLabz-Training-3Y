<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f4f8"/>
  <!-- Antennas -->
  <line x1="40" y1="25" x2="35" y2="15" stroke="#4a5568" stroke-width="3" />
  <circle cx="35" cy="15" r="4" fill="#ed8936" />
  <line x1="60" y1="25" x2="65" y2="15" stroke="#4a5568" stroke-width="3" />
  <circle cx="65" cy="15" r="4" fill="#ed8936" />
  <!-- Ears -->
  <rect x="20" y="35" width="6" height="12" rx="3" fill="#ed8936" />
  <rect x="74" y="35" width="6" height="12" rx="3" fill="#ed8936" />
  <!-- Head -->
  <rect x="25" y="25" width="50" height="32" rx="10" fill="#63b3ed" stroke="#2b6cb0" stroke-width="3" />
  <!-- Eyes -->
  <circle cx="40" cy="40" r="6" fill="#fff" />
  <circle cx="40" cy="40" r="3" fill="#2d3748" />
  <circle cx="60" cy="40" r="6" fill="#fff" />
  <circle cx="60" cy="40" r="3" fill="#2d3748" />
  <!-- Mouth -->
  <path d="M 45 48 Q 50 54 55 48" fill="none" stroke="#2d3748" stroke-width="3" stroke-linecap="round" />
  <!-- Body -->
  <rect x="32" y="60" width="36" height="25" rx="5" fill="#4299e1" stroke="#2b6cb0" stroke-width="3" />
  <!-- Screen/Heart on Body -->
  <rect x="40" y="65" width="20" height="12" rx="2" fill="#ebf8ff" />
  <path d="M 50 73 C 48 70, 46 70, 46 72 C 46 74, 50 76, 50 76 C 50 76, 54 74, 54 72 C 54 70, 52 70, 50 73 Z" fill="#e53e3e" />
  <!-- Limbs -->
  <!-- Left Arm -->
  <rect x="18" y="63" width="12" height="6" rx="2" fill="#4a5568" />
  <!-- Right Arm -->
  <rect x="70" y="63" width="12" height="6" rx="2" fill="#4a5568" />
  <!-- Left Leg -->
  <rect x="38" y="87" width="8" height="8" rx="2" fill="#4a5568" />
  <!-- Right Leg -->
  <rect x="54" y="87" width="8" height="8" rx="2" fill="#4a5568" />
</svg>
