<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding for the document -->
    <meta charset="UTF-8">
    <!-- Viewport setting to ensure proper rendering on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page Title -->
    <title>Task 1 - YouTube Video Embedding</title>
</head>

<body>
    <!-- Main Header -->
    <header>
        <h1>Responsive YouTube Video Embed</h1>
        <p>This page demonstrates embedding a YouTube video using an iframe with percentage-based dimensions.</p>
    </header>

    <hr>

    <!-- Content Section -->
    <main>
        <!-- 
            We use percentage values (width="80%" and height="450px" is standard, but the question says 
            "Set the width and height using only percentage values (not pixels)").
            Therefore, we set width="90%" and height="75%" directly on the iframe.
        -->
        <h2>Video Presentation</h2>
        <iframe 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
            title="YouTube video player" 
            width="90%" 
            height="75%" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </main>

    <hr>

    <!-- Footer containing details -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 1</p>
    </footer>
</body>

</html>
