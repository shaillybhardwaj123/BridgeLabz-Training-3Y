<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport for mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 8 - Customer Feedback Form</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>Customer Feedback Form</h1>
        <p>We value your opinion! Please let us know how we did.</p>
    </header>

    <hr>

    <!-- Feedback Form Section -->
    <main>
        <!-- Form configured to use POST method submitting to "#" -->
        <form action="#" method="POST">
            <fieldset>
                <legend>Your Feedback</legend>

                <!-- Rating Section using Radio Buttons -->
                <p>
                    <strong>Rate Your Experience:</strong><br>
                    
                    <input type="radio" id="ratingGood" name="rating" value="Good" required>
                    <label for="ratingGood">Good</label>
                    
                    &nbsp;&nbsp;&nbsp;
                    
                    <input type="radio" id="ratingAverage" name="rating" value="Average">
                    <label for="ratingAverage">Average</label>
                    
                    &nbsp;&nbsp;&nbsp;
                    
                    <input type="radio" id="ratingPoor" name="rating" value="Poor">
                    <label for="ratingPoor">Poor</label>
                </p>

                <!-- Detailed Feedback Textarea -->
                <p>
                    <label for="feedbackComments">Detailed Comments:</label><br>
                    <textarea id="feedbackComments" name="feedback" rows="6" cols="50" placeholder="Type your feedback here..." required></textarea>
                </p>

                <!-- Submit Button -->
                <p>
                    <button type="submit">Submit Feedback</button>
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 8</p>
    </footer>
</body>

</html>
