<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport for mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 7 - Login Form with CSRF Protection</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>Secure Login</h1>
        <p>Enter your credentials below to log in.</p>
    </header>

    <hr>

    <!-- Login Form Section -->
    <main>
        <form action="#" method="POST">
            <!-- 
                CSRF (Cross-Site Request Forgery) Token:
                A CSRF token is a unique, secret, and unpredictable value generated by the server-side application 
                to protect vulnerable resources. It is sent to the client browser and must be included in subsequent 
                state-changing HTTP requests (like POST requests) made by the user. 
                
                The server validates this token before performing the requested action. This ensures that the request 
                was intentionally initiated by the authenticated user from the legitimate website, rather than a 
                malicious site attempting to hijack their session.
            -->
            <!-- Dummy CSRF Token Hidden Input -->
            <input type="hidden" name="csrf_token" value="d8f28c6267f5ea35d0b98bc28a1c8901">

            <fieldset>
                <legend>Sign In</legend>

                <!-- Username Field -->
                <p>
                    <label for="username">Username or Email:</label><br>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </p>

                <!-- Password Field -->
                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </p>

                <!-- Submit Button -->
                <p>
                    <button type="submit">Log In</button>
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 7</p>
    </footer>
</body>

</html>
