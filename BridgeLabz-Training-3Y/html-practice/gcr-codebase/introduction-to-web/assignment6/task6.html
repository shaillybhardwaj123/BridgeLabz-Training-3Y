<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport for mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 6 - User Registration Form</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>User Registration Form</h1>
        <p>Please fill out this form to register your account. All fields are required.</p>
    </header>

    <hr>

    <!-- Registration Form Section -->
    <main>
        <!-- Form Tag with basic action and POST method -->
        <form action="#" method="POST">
            <fieldset>
                <legend>Registration Details</legend>
                
                <!-- Full Name Field -->
                <p>
                    <label for="fullName">Full Name:</label><br>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </p>
                
                <!-- Email Field -->
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </p>
                
                <!-- Password Field -->
                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </p>
                
                <!-- Confirm Password Field -->
                <p>
                    <label for="confirmPassword">Confirm Password:</label><br>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
                </p>
                
                <!-- Submit Button -->
                <p>
                    <button type="submit">Register Now</button>
                    <button type="reset">Reset Form</button>
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 6</p>
    </footer>
</body>

</html>
