<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport for mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 17 - Iframe Form Submission Target</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>Iframe Target Form Submission</h1>
        <p>This form uses an iframe target to display the submission response inside the frame instead of reloading the main page.</p>
    </header>

    <hr>

    <!-- Main Content Area -->
    <main>
        <!-- 
            We configure the form action to point to "result.html" and the target attribute 
            to point to the name of our iframe ("submissionTarget"). When submitted, the browser 
            will load the action URL inside the targeted iframe frame.
        -->
        <form action="result.html" method="GET" target="submissionTarget">
            <fieldset>
                <legend>Submit Feedback/Data</legend>
                
                <p>
                    <label for="usernameInput">Enter Username:</label><br>
                    <input type="text" id="usernameInput" name="username" placeholder="e.g. shailly" required>
                </p>
                
                <p>
                    <button type="submit">Submit Form</button>
                </p>
            </fieldset>
        </form>

        <br>

        <h2>Response Viewer Frame</h2>
        <!-- Target Iframe receiving the form submission output -->
        <p>
            <iframe 
                name="submissionTarget" 
                title="Form Submission Target" 
                width="80%" 
                height="150" 
                frameborder="1">
            </iframe>
        </p>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 17</p>
    </footer>
</body>

</html>
