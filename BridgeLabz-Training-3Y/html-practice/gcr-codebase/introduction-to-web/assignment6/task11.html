<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport for mobile optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 11 - Student Information Form</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>Student Information Portal</h1>
        <p>Please enter your information to register for the semester courses.</p>
    </header>

    <hr>

    <!-- Student Information Form Section -->
    <main>
        <form action="#" method="POST">
            <fieldset>
                <legend>Academic Information</legend>

                <!-- Student Name Field -->
                <p>
                    <label for="studentName">Student Full Name:</label><br>
                    <input type="text" id="studentName" name="student_name" placeholder="Enter student's name" required>
                </p>

                <!-- Roll Number Field -->
                <p>
                    <label for="rollNumber">Roll Number:</label><br>
                    <input type="text" id="rollNumber" name="roll_number" placeholder="e.g., 201500201" required>
                </p>

                <!-- Course Selection Dropdown -->
                <p>
                    <label for="selectCourse">Select Course:</label><br>
                    <!-- Dropdown select element -->
                    <select id="selectCourse" name="course" required>
                        <!-- 
                            Default Option:
                            - disabled: prevents users from selecting it once they open the list
                            - selected: makes it show as the default selection when the page loads
                        -->
                        <option value="" disabled selected>Select Course</option>
                        <option value="cs">Computer Science & Engineering</option>
                        <option value="it">Information Technology</option>
                        <option value="ece">Electronics & Communication Engineering</option>
                        <option value="ee">Electrical Engineering</option>
                        <option value="me">Mechanical Engineering</option>
                    </select>
                </p>

                <!-- Submit Button -->
                <p>
                    <button type="submit">Submit Details</button>
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 11</p>
    </footer>
</body>

</html>
