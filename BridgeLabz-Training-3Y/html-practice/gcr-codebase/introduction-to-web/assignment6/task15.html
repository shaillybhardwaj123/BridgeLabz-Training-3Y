<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport setting for responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 15 - Payment Gateway Form</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>Secure Payment Checkout</h1>
        <p>Enter your credit or debit card details to complete your payment.</p>
    </header>

    <hr>

    <!-- Payment Form Section -->
    <main>
        <form action="#" method="POST">
            <fieldset>
                <legend>Billing &amp; Card Details</legend>

                <!-- Cardholder Name -->
                <p>
                    <label for="cardName">Cardholder Name:</label><br>
                    <input type="text" id="cardName" name="card_name" placeholder="Full Name as on Card" required>
                </p>

                <!-- Card Number -->
                <p>
                    <label for="cardNumber">Card Number:</label><br>
                    <input type="text" id="cardNumber" name="card_number" placeholder="1234-5678-9012-3456" pattern="[0-9 -]{13,19}" required>
                </p>

                <!-- Expiry Date -->
                <p>
                    <label for="expiryDate">Expiry Date:</label><br>
                    <!-- Expiry date can be input via month field or text with pattern MM/YY -->
                    <input type="text" id="expiryDate" name="expiry_date" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" required>
                </p>

                <!-- CVV Code -->
                <p>
                    <label for="cvvCode">CVV / Security Code:</label><br>
                    <input type="password" id="cvvCode" name="cvv" placeholder="123" pattern="[0-9]{3,4}" required>
                </p>

                <!-- Pay Now Button -->
                <p>
                    <button type="submit">Pay Now</button>
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 15</p>
    </footer>
</body>

</html>
