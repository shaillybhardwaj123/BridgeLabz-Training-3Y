<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specify character encoding -->
    <meta charset="UTF-8">
    <!-- Viewport for mobile device rendering -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title>Task 10 - Contact Us Form</title>
</head>

<body>
    <!-- Page Header -->
    <header>
        <h1>Contact Our Team</h1>
        <p>Fill out the form below and we will get back to you as soon as possible.</p>
    </header>

    <hr>

    <!-- Contact Form Section -->
    <main>
        <form action="#" method="POST">
            <fieldset>
                <legend>Send Us a Message</legend>

                <!-- Full Name Input -->
                <p>
                    <label for="contactName">Full Name:</label><br>
                    <input type="text" id="contactName" name="name" placeholder="John Doe" required>
                </p>

                <!-- Email Address Input -->
                <p>
                    <label for="contactEmail">Email Address:</label><br>
                    <input type="email" id="contactEmail" name="email" placeholder="john.doe@example.com" required>
                </p>

                <!-- Subject Input -->
                <p>
                    <label for="contactSubject">Subject:</label><br>
                    <input type="text" id="contactSubject" name="subject" placeholder="What is this inquiry about?" required>
                </p>

                <!-- Message Textarea -->
                <p>
                    <label for="contactMessage">Message:</label><br>
                    <textarea id="contactMessage" name="message" rows="5" cols="45" placeholder="Write your message here..." required></textarea>
                </p>

                <!-- Action Buttons -->
                <p>
                    <button type="submit">Send Message</button>
                    <button type="reset">Clear</button>
                </p>
            </fieldset>
        </form>
    </main>

    <hr>

    <!-- Footer Area -->
    <footer>
        <p>&copy; 2026 Shailly Bhardwaj - Assignment 6 Task 10</p>
    </footer>
</body>

</html>
