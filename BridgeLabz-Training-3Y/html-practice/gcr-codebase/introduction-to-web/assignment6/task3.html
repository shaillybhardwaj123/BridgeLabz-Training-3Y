    <!-- Main Content Area -->
    <main>
        <!-- First Iframe for Profile/Introduction -->

        <br>

        <!-- Second Iframe for Hobbies -->
        <h2>Second Iframe: Favorite Hobby</h2>

            <iframe 
                src="task3_hobby.html" 
                title="Favorite Hobby" 
                width="80%" 
                height="220" 
                frameborder="1">
            </iframe>
        </p>
    </main>
