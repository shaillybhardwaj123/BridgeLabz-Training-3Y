<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms Elements</title>
</head>
<body>
    <form>
        <fieldset>
            <legend> html dummy form</legend>
       
        <label for="selector1">Select your favourite dish</label>
        <select name ="dishes" id="selector1" >
            <option value="maggie">Maggie</option>
            <option value="pasta">Pasta</option>
            <option value="pizza">Pizza</option>
            <option value="burger">Burger</option>
        </select>
        <br/>
        <br/>
        <label for="textarea1"> comments</label>
        <br/>
        <textarea name="textarea" id="textarea1" rows="10" cols="20" placeholder="Enter your text here"></textarea>
         </fieldset>
    </form>
</body>
</html>
