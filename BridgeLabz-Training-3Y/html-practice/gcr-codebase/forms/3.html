<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Input types</title>
</head>
<body>
    <form>
        <label for="radio1"> male </label>
        <input type="radio" name="radio1" id="radio1">
        <label for="radio2"> female </label>
        <input type="radio" name="radio1" id="radio2">
        <label for="radio3"> other </label>
        <input type="radio" name="radio1" id="radio3">
        <br/>
        <br/>
        <input type="checkbox" name="checkbox1" id="checkbox1">
        <label for="checkbox1"> english</label>
        <input type="checkbox" name="checkbox1" id="checkbox2">
        <label for="checkbox2"> hindi</label>
        <input type="checkbox" name="checkbox1" id="checkbox3">
        <label for="checkbox3"> punjabi</label>
        <br/>
        <br/>
        <label for="file1"> upload a file</label>
        <input type="file" id="file1" name="file1">
        <br/>
        <br/>
        <input type="image" name="image" id="image" src="https://images.pexels.com/photos/31284696/pexels-photo-31284696.jpeg?cs=srgb&dl=pexels-optical-chemist-340351297-31284696.jpg&fm=jpg"  height="50" width="50">
        <br/>
        <br/>
        <label for="password">Enter password</label>
        <input type="password" name="password" id="password" placeholder="password"> 
        <br/>
        <br/>
        <label for="datepicker">Select date</label>
        <input type="date" name="date picker" id="datepicker">
    </form>  
</body>
</html>
