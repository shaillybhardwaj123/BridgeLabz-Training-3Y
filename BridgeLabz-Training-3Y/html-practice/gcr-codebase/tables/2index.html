<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1">
  <thead>
    <th>Column1</th>
    <th>Column2</th>
    <th>Column3</th>
  </thead>  
  <tbody>
    <tr>
        <td rowspan="2">Row1cell1</td>
        <td>Row1cell2</td>
        <td>Row1cell3</td>
    </tr>
    <tr>

        <td>Row2cell2</td>
        <td>Row2cell3</td>
    </tr>
    <tr>
        <td colspan="3">Row3cell1</td>
        
    </tr>
  </tbody>
</table>
</body>
</html>
