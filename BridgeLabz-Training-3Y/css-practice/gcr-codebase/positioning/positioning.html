<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css Positioning</title>
    <style>
        div{
            border-color: blue;
        }
        .img1{
            margin:10px;
        }
        .img4{
            position: fixed;
 
        }
        .container{
            height: 8000px;
            background-color: beige;
        }
        .img3{
            position: sticky;
            top: 100px;
        }
        .box{
            height: 100px;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
   <div class="container">
   <img
   src="https://cdnb.artstation.com/p/marketplace/presentation_assets/003/430/265/large/file.jpg?1706950304"
   alt="image1"
   width="300px"
   height="300px"
   class="img1"
    />
   <img 
   src="https://images.pexels.com/photos/31284696/pexels-photo-31284696.jpeg?cs=srgb&dl=pexels-optical-chemist-340351297-31284696.jpg&fm=jpg"
   alt="image2"
   width="300px"
   height="300px"
   class="img2"
    />
     <img
   src="https://cdna.artstation.com/p/marketplace/presentation_assets/003/430/266/large/file.jpg?1706950306"
   alt="image3"
   width="300px"
   height="300px"
   class="img3"
    />
     <img
   src="https://static.vecteezy.com/system/resources/thumbnails/030/691/034/small_2x/pixel-turbulences-sculpting-intriguing-digital-landscapes-free-photo.jpg"
   alt="image4"
   width="300px"
   height="300px"
   class="img4"
    />
</div>
<div class="box">

</div>
</body>
</html>
