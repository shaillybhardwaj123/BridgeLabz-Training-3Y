<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="sky-peaks" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#sky-peaks)" />
    <!-- Mountains -->
    <polygon points="100,300 200,100 300,300" fill="#0284c7" />
    <polygon points="170,160 200,100 230,160" fill="#f8fafc" /> <!-- Snow cap -->
    
    <polygon points="0,300 100,140 220,300" fill="#0369a1" opacity="0.9" />
    <polygon points="70,192 100,140 130,192" fill="#f8fafc" opacity="0.9" />
    
    <polygon points="200,300 300,160 400,300" fill="#0f766e" opacity="0.8" />
    <polygon points="275,200 300,160 325,200" fill="#f8fafc" opacity="0.8" />
</svg>
