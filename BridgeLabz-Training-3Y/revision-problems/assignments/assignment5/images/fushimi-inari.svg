<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <linearGradient id="inari-sunset" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" />
            <stop offset="50%" stop-color="#f43f5e" />
            <stop offset="100%" stop-color="#4c0519" />
        </linearGradient>
    </defs>
    <!-- Background Sky -->
    <rect width="800" height="600" fill="url(#inari-sunset)" />
    <!-- Torii Gates Silhouettes (increasing size for perspective) -->
    <g fill="#1e020a" opacity="0.95">
        <!-- Far Gate -->
        <g transform="translate(400, 300) scale(0.4) translate(-400, -300)">
            <rect x="360" y="200" width="80" height="400" />
            <rect x="300" y="200" width="200" height="40" />
            <path d="M260 160 L540 160 L520 210 L280 210 Z" />
        </g>
        <!-- Mid Gate -->
        <g transform="translate(400, 300) scale(0.65) translate(-400, -300)">
            <rect x="350" y="200" width="100" height="400" />
            <rect x="250" y="200" width="300" height="50" />
            <path d="M200 150 L600 150 L570 210 L230 210 Z" />
        </g>
        <!-- Close Gate -->
        <g transform="translate(400, 300) scale(1) translate(-400, -300)">
            <!-- Left Pillar -->
            <rect x="240" y="200" width="50" height="400" />
            <!-- Right Pillar -->
            <rect x="510" y="200" width="50" height="400" />
            <!-- Bottom Beam -->
            <rect x="200" y="260" width="400" height="45" />
            <!-- Top Beam Curve -->
            <path d="M140 160 Q 400 190 660 160 L 630 230 Q 400 245 170 230 Z" />
            <!-- Spans/connectors -->
            <rect x="375" y="200" width="50" height="65" />
        </g>
    </g>
</svg>
