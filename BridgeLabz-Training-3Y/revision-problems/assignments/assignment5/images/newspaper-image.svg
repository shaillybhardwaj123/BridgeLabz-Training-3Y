<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
    <defs>
        <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>
    </defs>
    <!-- Card Frame -->
    <rect width="300" height="200" fill="url(#paper)" rx="8" />
    <!-- Abstract Newspaper Graphic Lines -->
    <!-- Large Header bar -->
    <rect x="20" y="20" width="260" height="20" fill="#475569" rx="4" />
    <circle cx="250" cy="30" r="6" fill="#f8fafc" />
    <!-- Paragraph line representations -->
    <rect x="20" y="60" width="160" height="8" fill="#64748b" rx="2" />
    <rect x="20" y="75" width="260" height="8" fill="#94a3b8" rx="2" />
    <rect x="20" y="90" width="260" height="8" fill="#94a3b8" rx="2" />
    <rect x="20" y="105" width="240" height="8" fill="#94a3b8" rx="2" />
    
    <!-- Image placeholder element inside graphic -->
    <rect x="20" y="125" width="80" height="55" fill="#475569" rx="4" />
    <polygon points="30,170 50,145 65,160 80,135 95,170" fill="#cbd5e1" />
    
    <rect x="110" y="125" width="170" height="8" fill="#94a3b8" rx="2" />
    <rect x="110" y="140" width="170" height="8" fill="#94a3b8" rx="2" />
    <rect x="110" y="155" width="150" height="8" fill="#94a3b8" rx="2" />
    <rect x="110" y="170" width="100" height="8" fill="#94a3b8" rx="2" />
</svg>
