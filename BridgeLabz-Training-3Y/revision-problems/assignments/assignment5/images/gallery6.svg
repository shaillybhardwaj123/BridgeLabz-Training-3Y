<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <defs>
        <linearGradient id="valley-sky" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#93c5fd" />
            <stop offset="100%" stop-color="#dbeafe" />
        </linearGradient>
        <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
    </defs>
    <rect width="400" height="300" fill="url(#valley-sky)" />
    <!-- Mountains -->
    <path d="M0 200 L120 80 L250 220 L320 120 L400 200 L400 300 L0 300 Z" fill="#0f766e" opacity="0.4" />
    <!-- Valley fields -->
    <path d="M0 220 Q 150 180 300 240 T 400 220 L 400 300 L 0 300 Z" fill="url(#grass)" />
    <path d="M0 250 Q 200 220 400 260 L 400 300 L 0 300 Z" fill="#065f46" opacity="0.9" />
    <!-- River -->
    <path d="M150 200 Q 200 230 180 260 T 220 300 L 250 300 Q 210 260 220 230 T 170 200 Z" fill="#38bdf8" />
</svg>
